<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8E1B2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RealBell" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary SEO Meta Tags -->
    <title>RealBell Business Foundation | India's Premier Startup Incubation Ecosystem</title>
    <meta name="description" content="RealBell Business Foundation (RBF) bridges early-stage startups with institutional angel syndicates, CXO mentors, incubation cohorts, and legal frameworks." />
    <meta name="keywords" content="RealBell, RealBell Business Foundation, RBF, Startup Incubation, Angel Investors, Mentorship, Pitch Decks, Venture Capital, Cohorts, DPIIT Recognized" />
    <meta name="author" content="RealBell Business Foundation" />

    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RealBell Business Foundation | Startup Incubation & Capital Network" />
    <meta property="og:description" content="Empowering India's next generation of entrepreneurial leaders through structured incubation, capital connections, and strategic mentorship." />
    <meta property="og:site_name" content="RealBell Business Foundation" />

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RealBell Business Foundation" />
    <meta name="twitter:description" content="Connect with founders, angel syndicates, and mentors on RealBell Business Foundation." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
        });
      }
    </script>
  </body>
</html>
